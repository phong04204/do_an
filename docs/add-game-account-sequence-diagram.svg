<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 980" width="100%" height="100%">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#c00000"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-opacity="0.28"/>
    </filter>
    <style>
      text { font-family: Arial, sans-serif; fill: #111; }
      .title { font-size: 19px; text-anchor: middle; }
      .head { font-size: 19px; text-anchor: middle; }
      .msgText { font-size: 14px; fill: #c00000; text-anchor: middle; }
      .sqlText { font-size: 14px; fill: #111; text-anchor: middle; }
      .life { stroke: #c00000; stroke-width: 1; }
      .call { stroke: #c00000; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red); }
      .ret { stroke: #c00000; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; marker-end: url(#arrow-red); }
      .act { fill: #fff; stroke: #111; stroke-width: 1.2; filter: url(#shadow); }
      .bar { fill: #fff; stroke: #111; stroke-width: 1.8; filter: url(#shadow); }
      .frame { fill: none; stroke: #111; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#fff"/>
  <text x="430" y="25" class="title">UC41 - Thêm tài khoản game</text>

  <g transform="translate(75,55)">
    <circle cx="0" cy="18" r="9" fill="#fff" stroke="#c00000" stroke-width="2"/>
    <line x1="0" y1="27" x2="0" y2="55" stroke="#c00000" stroke-width="2"/>
    <line x1="-15" y1="39" x2="15" y2="39" stroke="#c00000" stroke-width="2"/>
    <line x1="0" y1="55" x2="-14" y2="78" stroke="#c00000" stroke-width="2"/>
    <line x1="0" y1="55" x2="14" y2="78" stroke="#c00000" stroke-width="2"/>
    <text x="0" y="100" class="head">:Admin</text>
  </g>

  <g transform="translate(220,70)">
    <line x1="-24" y1="10" x2="-6" y2="10" stroke="#c00000" stroke-width="2"/>
    <line x1="-24" y1="-10" x2="-24" y2="30" stroke="#c00000" stroke-width="2"/>
    <circle cx="8" cy="10" r="15" fill="#fff" stroke="#c00000" stroke-width="2"/>
    <text x="0" y="60" class="head">:UI</text>
  </g>

  <g transform="translate(390,70)">
    <circle cx="0" cy="10" r="15" fill="#fff" stroke="#c00000" stroke-width="2"/>
    <path d="M-5 -6 A13 13 0 0 1 8 -3" fill="none" stroke="#c00000" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="0" y="60" class="head">:AdminController</text>
  </g>

  <g transform="translate(560,70)">
    <circle cx="0" cy="10" r="15" fill="#fff" stroke="#c00000" stroke-width="2"/>
    <line x1="-14" y1="25" x2="14" y2="25" stroke="#c00000" stroke-width="2"/>
    <text x="0" y="60" class="head">:GameAccount</text>
  </g>

  <g transform="translate(725,55)">
    <path d="M-24 9 C-24 0,24 0,24 9 L24 46 C24 55,-24 55,-24 46 Z" fill="#fff9c4" stroke="#111" stroke-width="1.8" filter="url(#shadow)"/>
    <path d="M-24 9 C-24 18,24 18,24 9" fill="none" stroke="#111" stroke-width="1.8"/>
    <text x="0" y="82" class="head">:game_accounts</text>
  </g>

  <line x1="75" y1="155" x2="75" y2="940" class="life"/>
  <line x1="220" y1="155" x2="220" y2="940" class="life"/>
  <line x1="390" y1="155" x2="390" y2="940" class="life"/>
  <line x1="560" y1="155" x2="560" y2="940" class="life"/>
  <line x1="725" y1="155" x2="725" y2="940" class="life"/>

  <line x1="25" y1="168" x2="835" y2="168" stroke="#777" stroke-width="2"/>
  <line x1="25" y1="173" x2="835" y2="173" stroke="#bbb" stroke-width="2"/>
  <rect x="300" y="150" width="260" height="34" class="bar"/>
  <text x="430" y="172" font-size="17" font-weight="700" text-anchor="middle">Thêm tài khoản game</text>

  <rect x="213" y="220" width="14" height="690" class="act"/>
  <rect x="383" y="380" width="14" height="490" class="act"/>
  <rect x="553" y="740" width="14" height="105" class="act"/>
  <rect x="718" y="780" width="14" height="45" class="act"/>

  <path d="M75 220 L213 220" class="call"/>
  <text x="143" y="205" class="msgText">1. Chọn chức năng</text>
  <text x="143" y="219" class="msgText">thêm tài khoản</text>

  <path d="M213 270 L75 270" class="ret"/>
  <text x="143" y="255" class="msgText">2. Hiển thị form</text>
  <text x="143" y="269" class="msgText">thêm tài khoản</text>

  <path d="M75 330 L213 330" class="call"/>
  <text x="143" y="315" class="msgText">3. Nhập thông tin</text>
  <text x="143" y="329" class="msgText">tài khoản game</text>

  <path d="M75 380 L213 380" class="call"/>
  <text x="143" y="365" class="msgText">4. Nhấn nút</text>
  <text x="143" y="379" class="msgText">"Lưu"</text>

  <path d="M227 430 L383 430" class="call"/>
  <text x="305" y="415" class="msgText">5. Gửi yêu cầu</text>
  <text x="305" y="429" class="msgText">tạo tài khoản game</text>

  <path d="M397 500 L455 500 Q470 500 470 515 L470 520 Q470 535 455 535 L397 535" class="call"/>
  <text x="455" y="474" class="msgText">6. Kiểm tra</text>
  <text x="455" y="488" class="msgText">dữ liệu hợp lệ</text>

  <rect x="45" y="590" width="360" height="125" class="frame"/>
  <text x="85" y="610" font-size="11" font-weight="700">alt [Dữ liệu không hợp lệ]</text>
  <path d="M383 650 L227 650" class="ret"/>
  <text x="305" y="635" class="msgText">
    <tspan x="305" dy="0">"Thông tin tài khoản</tspan>
    <tspan x="305" dy="13">không hợp lệ"</tspan>
  </text>
  <path d="M213 690 L75 690" class="ret"/>
  <text x="143" y="675" class="msgText">Hiển thị lỗi,</text>
  <text x="143" y="689" class="msgText">nhập lại</text>

  <path d="M397 740 L553 740" class="call"/>
  <text x="475" y="732" class="msgText">7. Tạo tài khoản game</text>

  <path d="M567 780 L718 780" class="call"/>
  <text x="642" y="764" class="sqlText">Lưu dữ liệu</text>
  <text x="642" y="778" class="sqlText">tài khoản</text>

  <path d="M718 825 L567 825" class="ret"/>
  <text x="642" y="818" class="msgText">Lưu thành công</text>

  <path d="M553 845 L397 845" class="ret"/>
  <text x="475" y="831" class="msgText">
    <tspan x="475" dy="0">Đối tượng tài khoản</tspan>
    <tspan x="475" dy="14">đã tạo</tspan>
  </text>

  <path d="M383 865 L227 865" class="ret"/>
  <text x="305" y="851" class="msgText">
    <tspan x="305" dy="0">"Thêm tài khoản game</tspan>
    <tspan x="305" dy="14">thành công"</tspan>
  </text>

  <path d="M213 900 L75 900" class="ret"/>
  <text x="143" y="872" class="msgText">8. Hiển thị</text>
  <text x="143" y="886" class="msgText">thông báo</text>
</svg>
