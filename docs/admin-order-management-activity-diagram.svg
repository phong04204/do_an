<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 780" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333333" />
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- TIÊU ĐỀ -->
  <text x="325" y="16" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">
    AD-UC08 - Quản lý và Xử lý đơn hàng (Admin)
  </text>

  <!-- SWIMLANES -->
  <line x1="25" y1="22" x2="25" y2="760" stroke="#999999" stroke-width="1" />
  <line x1="280" y1="22" x2="280" y2="760" stroke="#999999" stroke-width="1" />
  <line x1="625" y1="22" x2="625" y2="760" stroke="#999999" stroke-width="1" />

  <text x="150" y="34" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Quản trị viên (Admin)</text>
  <text x="450" y="34" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Hệ thống</text>

  <!-- Start Node -->
  <circle cx="150" cy="52" r="7" fill="#000000" />
  <line x1="150" y1="59" x2="150" y2="76" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Vào Quản lý đơn hàng -->
  <rect x="95" y="76" width="110" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="150" y="97" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Vào Quản lý đơn hàng</text>

  <line x1="205" y1="93" x2="380" y2="93" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Hệ thống tải danh sách đơn -->
  <rect x="380" y="76" width="140" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="450" y="97" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Tải danh sách đơn hàng</text>

  <path d="M 450 110 L 450 135 L 205 135" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Lọc đơn hàng -->
  <rect x="95" y="120" width="110" height="32" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="150" y="140" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Lọc theo trạng thái</text>

  <line x1="150" y1="152" x2="150" y2="180" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Chọn xem chi tiết -->
  <rect x="90" y="180" width="120" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="150" y="201" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Chọn xem chi tiết đơn</text>

  <line x1="210" y1="197" x2="375" y2="197" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Mở modal chi tiết -->
  <rect x="375" y="180" width="150" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="450" y="201" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Mở modal chi tiết &amp; mã VNPay</text>

  <path d="M 450 214 L 450 240 L 205 240" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Admin xem và chọn xử lý -->
  <rect x="85" y="225" width="130" height="32" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="150" y="245" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Kiểm tra thông tin đối soát</text>

  <line x1="150" y1="257" x2="150" y2="285" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Decision: Tình trạng đơn? -->
  <polygon points="150,285 205,300 150,315 95,300" fill="#fff9db" stroke="#cc0000" stroke-width="0.9" />
  <text x="150" y="303" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#990000">Tình trạng?</text>

  <!-- Đơn hợp lệ -> Đóng modal -->
  <text x="60" y="325" font-family="Arial, sans-serif" font-size="8" fill="#008800">[Hợp lệ]</text>
  <path d="M 95 300 L 70 300 L 70 350 L 95 350" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="95" y="335" width="110" height="30" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="150" y="353" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Đóng xem chi tiết</text>

  <!-- Khiếu nại / Hủy đơn -->
  <text x="210" y="325" font-family="Arial, sans-serif" font-size="8" fill="#cc0000">[Khiếu nại / Hủy]</text>
  <path d="M 205 300 L 235 300 L 235 350 L 215 350" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="105" y="380" width="90" height="30" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="150" y="398" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Nhập lý do hủy đơn</text>

  <line x1="150" y1="410" x2="150" y2="435" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Decision: Xác nhận hủy? -->
  <polygon points="150,435 205,450 150,465 95,450" fill="#fff9db" stroke="#cc0000" stroke-width="0.9" />
  <text x="150" y="453" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#990000">Xác nhận hủy?</text>

  <!-- Không hủy -->
  <text x="60" y="460" font-family="Arial, sans-serif" font-size="8" fill="#555555">[Không]</text>
  <path d="M 95 450 L 50 450 L 50 630 L 135 630" fill="none" stroke="#333333" stroke-width="0.9" />

  <!-- Đồng ý hủy -> Gửi yêu cầu sang Hệ thống -->
  <text x="160" y="480" font-family="Arial, sans-serif" font-size="8" fill="#cc0000">[Đồng ý]</text>
  <path d="M 205 450 L 375 450" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <rect x="375" y="435" width="150" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="450" y="455" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Cập nhật đơn sang 'cancelled'</text>

  <line x1="450" y1="469" x2="450" y2="505" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Tự động hoàn kho sản phẩm -->
  <rect x="365" y="505" width="170" height="36" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="450" y="522" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">
    <tspan x="450" dy="0">Tự động hoàn trả sản phẩm:</tspan>
    <tspan x="450" dy="11">từ 'sold' về 'available'</tspan>
  </text>

  <line x1="450" y1="541" x2="450" y2="575" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Ghi log & thông báo -->
  <rect x="375" y="575" width="150" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="450" y="595" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Lưu log hủy &amp; làm mới bảng</text>

  <!-- Gộp kết thúc -->
  <polygon points="150,620 165,629 150,638 135,629" fill="#f8cecc" stroke="#b85450" stroke-width="0.8" />
  <path d="M 150 365 L 150 620" fill="none" stroke="#333333" stroke-width="0.9" />
  <path d="M 450 609 L 450 629 L 165 629" fill="none" stroke="#333333" stroke-width="0.9" />

  <line x1="150" y1="638" x2="150" y2="685" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- End Node -->
  <circle cx="150" cy="695" r="10" fill="none" stroke="#000000" stroke-width="1.5" />
  <circle cx="150" cy="695" r="6" fill="#000000" />
</svg>
