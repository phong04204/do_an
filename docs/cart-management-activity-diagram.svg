<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 730" width="100%" height="100%">
  <defs>
    <!-- Mũi tên kết nối chuẩn UML -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333333" />
    </marker>
    <!-- Hiệu ứng đổ bóng các khối thao tác -->
    <filter id="shadow" x="-4%" y="-4%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Nền canvas trắng -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- TIÊU ĐỀ BIỂU ĐỒ -->
  <text x="390" y="18" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">
    AD-UC2 - Thêm sản phẩm &amp; Quản lý giỏ hàng
  </text>

  <!-- ================= PHÂN LÀN (SWIMLANES) ================= -->
  <!-- Đường biên phân làn -->
  <line x1="20" y1="26" x2="20" y2="710" stroke="#999999" stroke-width="1" />
  <line x1="410" y1="26" x2="410" y2="710" stroke="#999999" stroke-width="1" />
  <line x1="760" y1="26" x2="760" y2="710" stroke="#999999" stroke-width="1" />

  <!-- Tiêu đề từng làn -->
  <text x="215" y="40" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Người dùng</text>
  <text x="585" y="40" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Hệ thống</text>

  <!-- ================= 1. KHỞI TẠO & TRANG CHỦ ================= -->
  <!-- Start Node -->
  <circle cx="215" cy="56" r="6.5" fill="#000000" />

  <!-- Start -> Giao diện trang sản phẩm -->
  <line x1="215" y1="62.5" x2="215" y2="76" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối: Giao diện trang sản phẩm -->
  <rect x="145" y="76" width="140" height="34" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="215" y="97" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Giao diện trang sản phẩm</text>

  <!-- Giao diện trang sản phẩm -> Hiển thị danh sách sản phẩm (Hệ thống) -->
  <line x1="285" y1="93" x2="485" y2="93" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối: Hiển thị danh sách các sản phẩm -->
  <rect x="485" y="76" width="190" height="34" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="580" y="90" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Hiển thị danh sách</text>
  <text x="580" y="102" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">các sản phẩm</text>

  <!-- Hiển thị sản phẩm -> Rẽ nhánh Chọn chức năng (Người dùng) -->
  <polyline points="580,110 580,126 215,126 215,142" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <text x="395" y="122" font-family="Arial, sans-serif" font-size="8" font-style="italic" text-anchor="middle" fill="#555555">[Chọn chức năng]</text>

  <!-- ================= 2. QUYẾT ĐỊNH CHỌN CHỨC NĂNG ================= -->
  <!-- Decision: Chọn chức năng -->
  <polygon points="215,142 265,154 215,166 165,154" fill="#fff9db" stroke="#cc0000" stroke-width="0.9" />
  <text x="215" y="157" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#990000">Chọn chức năng</text>

  <!-- ================= NHÁNH 1 (BÊN TRÁI): THÊM SẢN PHẨM VÀO GIỎ HÀNG ================= -->
  <!-- Đường rẽ trái -->
  <polyline points="165,154 110,154 110,192" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <text x="110" y="180" font-family="Arial, sans-serif" font-size="7.5" text-anchor="middle" fill="#333333">[Thêm sản phẩm vào giỏ hàng]</text>

  <!-- Khối: Chọn sản phẩm cần thêm vào giỏ hàng -->
  <rect x="40" y="192" width="140" height="38" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="110" y="207" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Chọn sản phẩm cần</text>
  <text x="110" y="220" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">thêm vào giỏ hàng.</text>

  <!-- Mũi tên xuống Nhấn nút Thêm vào giỏ hàng -->
  <line x1="110" y1="230" x2="110" y2="252" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối: Nhấn nút "Thêm vào giỏ hàng" -->
  <rect x="40" y="252" width="140" height="38" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="110" y="267" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Nhấn nút</text>
  <text x="110" y="280" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">"Thêm vào giỏ hàng"</text>

  <!-- Nhấn nút -> Hệ thống: Thêm sản phẩm vào giỏ hàng thành công -->
  <line x1="180" y1="271" x2="480" y2="271" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối Hệ thống: Thêm sản phẩm vào giỏ hàng thành công -->
  <rect x="480" y="252" width="200" height="38" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="580" y="267" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Thêm sản phẩm vào</text>
  <text x="580" y="280" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">giỏ hàng thành công</text>

  <!-- ================= NHÁNH 2 (BÊN PHẢI): SỬA SỐ LƯỢNG / XÓA / XEM GIỎ HÀNG ================= -->
  <!-- Đường rẽ phải từ Chọn chức năng sang Giao diện giỏ hàng -->
  <polyline points="265,154 320,154 320,192" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <text x="320" y="180" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#333333">[Sửa số lượng/Xóa/Xem giỏ]</text>

  <!-- Khối: Giao diện giỏ hàng -->
  <rect x="260" y="192" width="120" height="38" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="320" y="215" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Giao diện giỏ hàng</text>

  <!-- Xuống Decision Thao tác trong giỏ -->
  <line x1="320" y1="230" x2="320" y2="310" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Decision: Rẽ nhánh Sửa số lượng / Xóa -->
  <polygon points="320,310 355,320 320,330 285,320" fill="#fff9db" stroke="#cc0000" stroke-width="0.9" />
  <text x="320" y="323" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#990000">Thao tác?</text>

  <!-- NHÁNH CON 2.1: SỬA SỐ LƯỢNG -->
  <!-- Đường rẽ sang Sửa số lượng -->
  <polyline points="285,320 250,320 250,348" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <text x="245" y="340" font-family="Arial, sans-serif" font-size="7.5" text-anchor="middle" fill="#333333">[Sửa số lượng]</text>

  <!-- Khối: Nhập số lượng -->
  <rect x="205" y="348" width="90" height="34" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="250" y="369" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Nhập số lượng</text>

  <!-- Mũi tên xuống Nhấn nút cập nhật -->
  <line x1="250" y1="382" x2="250" y2="408" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối: Nhấn nút cập nhật -->
  <rect x="200" y="408" width="100" height="34" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="250" y="429" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Nhấn nút cập nhật</text>

  <!-- Nhấn nút cập nhật -> Hệ thống: Sửa số lượng sản phẩm trong giỏ hàng thành công -->
  <line x1="300" y1="425" x2="480" y2="425" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối Hệ thống: Sửa số lượng sản phẩm trong giỏ hàng thành công -->
  <rect x="480" y="406" width="200" height="38" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="580" y="421" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Sửa số lượng sản phẩm</text>
  <text x="580" y="434" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">trong giỏ hàng thành công.</text>

  <!-- NHÁNH CON 2.2: XÓA SẢN PHẨM -->
  <!-- Đường rẽ sang Xóa sản phẩm -->
  <polyline points="355,320 365,320 365,490" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <text x="375" y="340" font-family="Arial, sans-serif" font-size="7.5" text-anchor="middle" fill="#333333">[Xóa]</text>

  <!-- Khối: Chọn sản phẩm cần xóa -->
  <rect x="315" y="490" width="100" height="34" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="365" y="504" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Chọn sản phẩm</text>
  <text x="365" y="516" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">cần xóa</text>

  <!-- Mũi tên xuống Nhấn nút "Xóa" -->
  <line x1="365" y1="524" x2="365" y2="550" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối: Nhấn nút "Xóa" -->
  <rect x="320" y="550" width="90" height="34" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="365" y="571" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Nhấn nút "Xóa"</text>

  <!-- Nhấn nút "Xóa" -> Hệ thống: Xóa sản phẩm trong giỏ hàng thành công -->
  <line x1="410" y1="567" x2="480" y2="567" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối Hệ thống: Xóa sản phẩm trong giỏ hàng thành công -->
  <rect x="480" y="548" width="200" height="38" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="580" y="563" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Xóa sản phẩm trong</text>
  <text x="580" y="576" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">giỏ hàng thành công</text>

  <!-- ================= 3. ĐIỂM GỘP & KẾT THÚC ================= -->
  <!-- Merge Diamond 1: Gộp Sửa và Xóa -->
  <polygon points="580,618 592,624 580,630 568,624" fill="#f8cecc" stroke="#b85450" stroke-width="0.9" />

  <!-- Sửa thành công xuống Merge Diamond 1 -->
  <polyline points="680,425 705,425 705,624 592,624" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Xóa thành công xuống Merge Diamond 1 -->
  <line x1="580" y1="586" x2="580" y2="618" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Merge Diamond 1 xuống Merge Diamond Final -->
  <line x1="580" y1="630" x2="580" y2="654" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Thêm thành công nối xuống Merge Diamond Final -->
  <polyline points="680,271 735,271 735,660 592,660" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Merge Node Final -->
  <polygon points="580,654 592,660 580,666 568,660" fill="#f8cecc" stroke="#b85450" stroke-width="0.9" />
  <line x1="580" y1="666" x2="580" y2="685" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Điểm kết thúc (End Node) -->
  <circle cx="580" cy="693" r="8" fill="none" stroke="#000000" stroke-width="1.2" />
  <circle cx="580" cy="693" r="4.8" fill="#000000" />
</svg>
