<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 350" width="100%" height="100%">
  <!-- Definition of standard UML arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="none" stroke="black" stroke-width="1.1" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="white" />
  
  <!-- Initial state (solid black dot) -->
  <circle cx="50" cy="110" r="7" fill="black" />
  <path d="M 57 110 L 120 110" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="85" y="100" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Khởi tạo</text>

  <!-- State: Giỏ hàng Rỗng (Empty) -->
  <rect x="120" y="80" width="120" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="180" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Rỗng (Empty)</text>

  <!-- Transitions between Empty & HasItems -->
  <!-- Empty -> HasItems (Top arrow) -->
  <path d="M 240 95 L 360 95" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="300" y="87" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Thêm sản phẩm</text>

  <!-- HasItems -> Empty (Bottom arrow) -->
  <path d="M 360 125 L 240 125" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="300" y="140" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Xóa hết / Trống</text>

  <!-- State: Có sản phẩm (Has Items) -->
  <rect x="360" y="80" width="130" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="425" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Có sản phẩm (Has Items)</text>

  <!-- HasItems -> CheckingOut (Left arrow of group) -->
  <path d="M 405 140 L 405 230" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="397" y="190" font-family="Arial, sans-serif" font-size="11" text-anchor="end">Bấm Thanh toán</text>

  <!-- CheckingOut -> HasItems (Right arrow of group) -->
  <path d="M 445 230 L 445 140" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="453" y="190" font-family="Arial, sans-serif" font-size="11" text-anchor="start">Hủy / Lỗi GD</text>

  <!-- State: Đang thanh toán (Checking Out) -->
  <rect x="360" y="230" width="130" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="425" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Đang thanh toán</text>

  <!-- CheckingOut -> Empty (Clear cart on successful order) -->
  <path d="M 360 260 L 180 260 L 180 140" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="270" y="252" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Thành công (Clear)</text>

  <!-- Final State (double concentric circle) -->
  <circle cx="180" cy="260" r="10" stroke="black" stroke-width="1.1" fill="none" />
  <circle cx="180" cy="260" r="6" fill="black" />

  <!-- From Empty -> Final -->
  <path d="M 180 140 L 180 250" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="188" y="195" font-family="Arial, sans-serif" font-size="11" text-anchor="start">Đăng xuất</text>
</svg>
