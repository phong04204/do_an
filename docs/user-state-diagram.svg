<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%">
  <!-- Definition of standard UML arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="none" stroke="black" stroke-width="1.1" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="white" />
  
  <!-- Initial state (solid black dot) -->
  <circle cx="50" cy="90" r="7" fill="black" />
  <path d="M 57 90 L 100 90" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />

  <!-- State: Chưa có tài khoản -->
  <rect x="100" y="60" width="140" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="170" y="95" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Chưa có tài khoản</text>

  <!-- Line: Đăng ký -->
  <path d="M 240 90 L 330 90" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="285" y="82" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Đăng ký</text>

  <!-- State: Chờ xác minh -->
  <rect x="330" y="60" width="130" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="395" y="95" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Chờ xác minh</text>

  <!-- Line: Đăng nhập -->
  <path d="M 395 120 L 395 200" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="403" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="start">Đăng nhập</text>

  <!-- State: Thông báo chưa xác minh -->
  <rect x="325" y="200" width="150" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="400" y="235" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Thông báo chưa xác minh</text>

  <!-- Line: Xác minh -->
  <path d="M 460 90 L 600 90" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="530" y="82" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Xác minh</text>

  <!-- State: Hoạt động -->
  <rect x="600" y="60" width="130" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="665" y="95" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Hoạt động</text>

  <!-- Line: Khóa (Orthogonal) -->
  <path d="M 665 120 L 665 170 L 565 170 L 565 200" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="590" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Khóa</text>

  <!-- State: Bị khóa -->
  <rect x="500" y="200" width="130" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="565" y="235" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Bị khóa</text>

  <!-- Line: Mở khóa (Orthogonal) -->
  <path d="M 500 230 L 460 230 L 460 150 L 610 150 L 610 120" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="468" y="180" font-family="Arial, sans-serif" font-size="11" text-anchor="start">Mở khóa</text>

  <!-- Line: Đăng xuất (Orthogonal from Hoạt động to Đăng xuất box) -->
  <path d="M 620 120 L 620 150 L 185 150 L 185 340" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="250" y="142" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Đăng xuất</text>

  <!-- State: Đăng xuất -->
  <rect x="120" y="340" width="130" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="185" y="375" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Đăng xuất</text>

  <!-- Line: Đăng nhập (from Bị khóa to Thông báo bị khóa) -->
  <path d="M 630 230 L 745 230 L 745 280" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="685" y="222" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Đăng nhập</text>

  <!-- State: Thông báo bị khóa -->
  <rect x="670" y="280" width="150" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="745" y="315" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Thông báo bị khóa</text>

  <!-- Final State (double concentric circle) -->
  <circle cx="780" cy="390" r="10" stroke="black" stroke-width="1.1" fill="none" />
  <circle cx="780" cy="390" r="6" fill="black" />

  <!-- Paths connecting to the Final State -->
  <!-- From Thông báo chưa xác minh -->
  <path d="M 400 260 L 400 390 L 765 390" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />

  <!-- From Thông báo bị khóa -->
  <path d="M 745 340 L 745 390 L 765 390" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />

  <!-- From Đăng xuất box -->
  <path d="M 185 400 L 185 420 L 780 420 L 780 405" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
</svg>
