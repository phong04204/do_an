<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <!-- Definition of standard UML arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="none" stroke="black" stroke-width="1.1" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="white" />
  
  <!-- Initial state (solid black dot) -->
  <circle cx="50" cy="70" r="7" fill="black" />
  <path d="M 57 70 L 100 70" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />

  <!-- State: Khởi tạo -->
  <rect x="100" y="40" width="120" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="160" y="75" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Khởi tạo</text>

  <!-- Line: Tạo đơn -->
  <path d="M 220 70 L 300 70" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="260" y="62" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Tạo đơn</text>

  <!-- State: Chờ thanh toán -->
  <rect x="300" y="40" width="130" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="365" y="75" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Chờ thanh toán</text>

  <!-- Line: Thanh toán -->
  <path d="M 430 70 L 510 70" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="470" y="62" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Thanh toán</text>

  <!-- State: Đang xử lý (VNPay) -->
  <rect x="510" y="40" width="150" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="585" y="75" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Đang xử lý (VNPay)</text>

  <!-- Line: Thành công (00) -->
  <path d="M 660 70 L 740 70" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="700" y="62" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Thành công (00)</text>

  <!-- State: Đã hoàn thành -->
  <rect x="740" y="40" width="120" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="800" y="75" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Đã hoàn thành</text>

  <!-- Line: Bàn giao credentials -->
  <path d="M 800 100 L 800 180" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="808" y="145" font-family="Arial, sans-serif" font-size="11" text-anchor="start">Tự động bàn giao</text>

  <!-- State: Đã bàn giao sản phẩm -->
  <rect x="735" y="180" width="130" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="800" y="215" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Đã bàn giao sản phẩm</text>

  <!-- Line: Hết hạn / Hủy -->
  <path d="M 365 100 L 365 180" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="373" y="145" font-family="Arial, sans-serif" font-size="11" text-anchor="start">Hết hạn / Hủy</text>

  <!-- State: Hủy đơn hàng -->
  <rect x="305" y="180" width="120" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="365" y="215" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Hủy đơn hàng</text>

  <!-- Line: Thất bại / Hủy (Mã 24) -->
  <path d="M 585 100 L 585 180" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="593" y="145" font-family="Arial, sans-serif" font-size="11" text-anchor="start">Thất bại / Hủy (24)</text>

  <!-- State: Thanh toán thất bại -->
  <rect x="515" y="180" width="140" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="585" y="215" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Thanh toán thất bại</text>

  <!-- Final State (double concentric circle) -->
  <circle cx="585" cy="350" r="10" stroke="black" stroke-width="1.1" fill="none" />
  <circle cx="585" cy="350" r="6" fill="black" />

  <!-- Paths connecting to the Final State -->
  <!-- From Hủy đơn hàng -->
  <path d="M 365 240 L 365 350 L 570 350" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="380" y="342" font-family="Arial, sans-serif" font-size="11">Đóng đơn</text>

  <!-- From Thanh toán thất bại -->
  <path d="M 585 240 L 585 335" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />

  <!-- From Đã bàn giao sản phẩm -->
  <path d="M 800 240 L 800 350 L 600 350" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="790" y="342" font-family="Arial, sans-serif" font-size="11" text-anchor="end">Đóng đơn</text>
</svg>
