<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" width="100%" height="100%">
  <defs>
    <!-- Mũi tên kết nối -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333333" />
    </marker>
    <!-- Đổ bóng nhẹ cho các khối -->
    <filter id="shadow" x="-4%" y="-4%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Nền trắng toàn bộ -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- TIÊU ĐỀ BIỂU ĐỒ -->
  <text x="360" y="16" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">
    AD-UC1.1 - Đăng ký tài khoản
  </text>

  <!-- ================= PHÂN LÀN (SWIMLANES) ================= -->
  <!-- Đường phân cách cột -->
  <line x1="25" y1="20" x2="25" y2="760" stroke="#999999" stroke-width="1" />
  <line x1="305" y1="20" x2="305" y2="760" stroke="#999999" stroke-width="1" />
  <line x1="695" y1="20" x2="695" y2="760" stroke="#999999" stroke-width="1" />

  <!-- Tên phân làn -->
  <text x="165" y="32" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">Khách vãng lai</text>
  <text x="500" y="32" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">Hệ thống</text>

  <!-- ================= CÁC NÚT VÀ KHỐI HOẠT ĐỘNG ================= -->

  <!-- 1. Start node (Khách vãng lai) -->
  <circle cx="165" cy="46" r="6.5" fill="#000000" />

  <!-- Mũi tên từ Start xuống Mở trang đăng ký -->
  <line x1="165" y1="52.5" x2="165" y2="67" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối: Mở trang đăng ký -->
  <rect x="140" y="67" width="50" height="34" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="165" y="80" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#000000">Mở trang</text>
  <text x="165" y="93" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#000000">đăng ký</text>

  <!-- Mũi tên từ Mở trang xuống Decision Đăng ký bằng? -->
  <line x1="165" y1="101" x2="165" y2="120" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Decision: Đăng ký bằng? -->
  <polygon points="165,120 205,130 165,140 125,130" fill="#fff9db" stroke="#cc0000" stroke-width="0.9" />
  <text x="165" y="133" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#990000">Đăng ký bằng?</text>

  <!-- Label nhánh Email & Google -->
  <text x="110" y="126" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Email</text>
  <text x="228" y="126" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Google</text>

  <!-- ================= LUỒNG BÊN TRÁI: EMAIL ================= -->
  <!-- Đường từ Đăng ký bằng? -> Nhập thông tin đăng ký -->
  <polyline points="125,130 50,130 50,152" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối: Nhập thông tin đăng ký -->
  <rect x="30" y="152" width="48" height="42" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="54" y="166" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Nhập</text>
  <text x="54" y="177" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">thông tin</text>
  <text x="54" y="188" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">đăng ký</text>

  <!-- Đường nối xuống Nhấn Đăng ký -->
  <line x1="54" y1="194" x2="54" y2="216" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối: Nhấn "Đăng ký" -->
  <rect x="30" y="216" width="50" height="34" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="55" y="230" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#000000">Nhấn</text>
  <text x="55" y="242" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#000000">"Đăng ký"</text>

  <!-- Đường từ Nhấn "Đăng ký" sang Kiểm tra thông tin (Hệ thống) -->
  <polyline points="55,250 55,275 390,275 390,286" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối: Kiểm tra thông tin -->
  <rect x="365" y="286" width="52" height="34" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="391" y="300" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Kiểm tra</text>
  <text x="391" y="312" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">thông tin</text>

  <!-- Đường xuống Decision Hợp lệ? -->
  <line x1="391" y1="320" x2="391" y2="333" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Decision: Hợp lệ? -->
  <polygon points="391,333 416,342 391,351 366,342" fill="#fff9db" stroke="#cc0000" stroke-width="0.9" />
  <text x="391" y="345" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#990000">Hợp lệ?</text>

  <!-- Labels Không & Có -->
  <text x="350" y="338" font-family="Arial, sans-serif" font-size="7.5" text-anchor="middle" fill="#000000">Không</text>
  <text x="424" y="338" font-family="Arial, sans-serif" font-size="7.5" text-anchor="middle" fill="#000000">Có</text>

  <!-- Nhánh Hợp lệ? = Không -> Thông báo lỗi -->
  <polyline points="366,342 330,342 330,360" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="306" y="360" width="52" height="30" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="332" y="373" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Thông báo</text>
  <text x="332" y="384" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">lỗi</text>

  <!-- Đường từ Thông báo lỗi xuống Merge diamond tổng lỗi phía dưới -->
  <polyline points="332,390 332,640 405,640" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Nhánh Hợp lệ? = Có -> Tạo tài khoản -->
  <polyline points="416,342 445,342 445,360" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="425" y="360" width="48" height="30" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="449" y="373" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Tạo</text>
  <text x="449" y="384" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">tài khoản</text>

  <!-- Đường từ Tạo tài khoản xuống Gửi email xác minh -->
  <line x1="449" y1="390" x2="449" y2="408" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối: Gửi email xác minh -->
  <rect x="424" y="408" width="52" height="30" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="450" y="420" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Gửi email</text>
  <text x="450" y="431" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">xác minh</text>

  <!-- Đường từ Gửi email xác minh sang Xác minh email (Khách vãng lai) -->
  <polyline points="424,423 115,423 115,448" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối: Xác minh email -->
  <rect x="85" y="448" width="50" height="30" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="110" y="460" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Xác minh</text>
  <text x="110" y="471" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">email</text>

  <!-- Đường từ Xác minh email sang Decision Xác minh? (Hệ thống) -->
  <polyline points="135,463 450,463 450,477" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Decision: Xác minh? -->
  <polygon points="450,477 478,486 450,495 422,486" fill="#fff9db" stroke="#cc0000" stroke-width="0.9" />
  <text x="450" y="489" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#990000">Xác minh?</text>

  <!-- Labels Không & Có -->
  <text x="408" y="483" font-family="Arial, sans-serif" font-size="7.5" text-anchor="middle" fill="#000000">Không</text>
  <text x="488" y="483" font-family="Arial, sans-serif" font-size="7.5" text-anchor="middle" fill="#000000">Có</text>

  <!-- Nhánh Xác minh? = Không -> Thông báo lỗi xác minh -->
  <polyline points="422,486 395,486 395,502" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="367" y="502" width="60" height="30" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="397" y="514" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Thông báo lỗi</text>
  <text x="397" y="525" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">xác minh</text>

  <!-- Nhánh Xác minh? = Có -> Kích hoạt tài khoản -->
  <polyline points="478,486 500,486 500,502" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="477" y="502" width="50" height="30" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="502" y="514" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Kích hoạt</text>
  <text x="502" y="525" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">tài khoản</text>

  <!-- Merge Diamond sau xác minh -->
  <polygon points="445,555 454,561 445,567 436,561" fill="#f8cecc" stroke="#b85450" stroke-width="0.8" />
  <!-- Nối từ Thông báo lỗi xác minh vào Merge -->
  <polyline points="397,532 397,561 436,561" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <!-- Nối từ Kích hoạt tài khoản vào Merge -->
  <polyline points="502,532 502,561 454,561" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Đường từ Merge sang Chuyển đến trang đăng nhập (Khách vãng lai) -->
  <polyline points="445,567 445,580 185,580" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối: Chuyển đến trang đăng nhập -->
  <rect x="110" y="567" width="75" height="26" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="147" y="579" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Chuyển đến</text>
  <text x="147" y="589" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">trang đăng nhập</text>

  <!-- ================= LUỒNG BÊN PHẢI: GOOGLE ================= -->
  <!-- Đường từ Đăng ký bằng? -> Chuyển đến Google -->
  <polyline points="205,130 600,130 600,152" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối: Chuyển đến Google -->
  <rect x="573" y="152" width="55" height="30" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="600" y="165" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Chuyển đến</text>
  <text x="600" y="176" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Google</text>

  <!-- Đường xuống Nhận thông tin Google -->
  <line x1="600" y1="182" x2="600" y2="202" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối: Nhận thông tin Google -->
  <rect x="570" y="202" width="64" height="30" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="602" y="215" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Nhận thông tin</text>
  <text x="602" y="226" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Google</text>

  <!-- Đường xuống Decision Thành công? -->
  <line x1="602" y1="232" x2="602" y2="246" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Decision: Thành công? -->
  <polygon points="602,246 630,255 602,264 574,255" fill="#fff9db" stroke="#cc0000" stroke-width="0.9" />
  <text x="602" y="258" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#990000">Thành công?</text>

  <!-- Labels Không & Có -->
  <text x="560" y="252" font-family="Arial, sans-serif" font-size="7.5" text-anchor="middle" fill="#000000">Không</text>
  <text x="640" y="252" font-family="Arial, sans-serif" font-size="7.5" text-anchor="middle" fill="#000000">Có</text>

  <!-- Nhánh Thành công? = Không -> Thông báo lỗi -->
  <polyline points="574,255 540,255 540,274" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="518" y="274" width="48" height="30" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="542" y="287" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Thông báo</text>
  <text x="542" y="298" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">lỗi</text>

  <!-- Đường từ Thông báo lỗi (Google) xuống Merge diamond Google -->
  <polyline points="542,304 542,442 593,442" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Nhánh Thành công? = Có -> Tạo hoặc cập nhật tài khoản -->
  <polyline points="630,255 650,255 650,274" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="625" y="274" width="50" height="42" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="650" y="288" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Tạo hoặc</text>
  <text x="650" y="299" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">cập nhật</text>
  <text x="650" y="310" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">tài khoản</text>

  <!-- Đường xuống Đăng nhập vào hệ thống -->
  <line x1="650" y1="316" x2="650" y2="338" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối: Đăng nhập vào hệ thống -->
  <rect x="618" y="338" width="64" height="30" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="650" y="350" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Đăng nhập</text>
  <text x="650" y="361" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">vào hệ thống</text>

  <!-- Đường từ Đăng nhập vào hệ thống sang Vào trang bảng tin -->
  <polyline points="618,353 300,353 300,410 286,410" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối: Chuyển đến trang chủ (Khách vãng lai / Hệ thống giao thoa) -->
  <rect x="228" y="396" width="66" height="30" rx="7" ry="7" fill="#ffffff" stroke="#334155" stroke-width="0.9" filter="url(#shadow)" />
  <text x="261" y="409" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Chuyển đến</text>
  <text x="261" y="420" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">trang chủ</text>

  <!-- Merge Diamond Google (bên phải) -->
  <polygon points="602,436 611,442 602,448 593,442" fill="#f8cecc" stroke="#b85450" stroke-width="0.8" />
  <!-- Nối từ Đăng nhập vào hệ thống xuống Merge Diamond Google -->
  <polyline points="650,368 650,442 611,442" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- ================= ĐOẠN MERGE VÀ KẾT THÚC DƯỚI CÙNG ================= -->
  <!-- Merge Diamond lỗi trung gian (414, 640) -->
  <polygon points="414,634 423,640 414,646 405,640" fill="#f8cecc" stroke="#b85450" stroke-width="0.8" />

  <!-- Đường từ Merge Google (602, 448) xuống Merge lỗi trung gian (414, 640) -->
  <polyline points="602,448 602,640 423,640" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Merge Diamond tổng cuối cùng trước Kết thúc (ở x = 165, y = 640) -->
  <polygon points="165,634 174,640 165,646 156,640" fill="#f8cecc" stroke="#b85450" stroke-width="0.8" />

  <!-- Đường từ Merge lỗi trung gian (414, 640) sang Merge tổng (174, 640) -->
  <line x1="405" y1="640" x2="174" y2="640" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Đường từ Chuyển đến trang đăng nhập (147, 593) xuống Merge tổng (165, 634) -->
  <polyline points="147,593 147,615 165,615 165,634" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Đường từ Vào trang bảng tin (261, 426) xuống Merge tổng (165, 634) -->
  <polyline points="261,426 261,625 165,625 165,634" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Đường từ Merge tổng xuống Kết thúc đăng ký -->
  <line x1="165" y1="646" x2="165" y2="665" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khối: Kết thúc đăng ký -->
  <rect x="141" y="665" width="48" height="34" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="165" y="679" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#000000">Kết thúc</text>
  <text x="165" y="691" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#000000">đăng ký</text>

  <!-- Mũi tên xuống End Node -->
  <line x1="165" y1="699" x2="165" y2="720" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- End node (Bullseye: vòng tròn đôi) -->
  <circle cx="165" cy="727" r="7" fill="none" stroke="#000000" stroke-width="1.2" />
  <circle cx="165" cy="727" r="4.2" fill="#000000" />
</svg>
