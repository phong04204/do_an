<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 350" width="100%" height="100%">
  <!-- Definition of standard UML arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="none" stroke="black" stroke-width="1.1" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="white" />
  
  <!-- Initial state (solid black dot) -->
  <circle cx="50" cy="110" r="7" fill="black" />
  <path d="M 57 110 L 120 110" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="85" y="100" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Đăng bán</text>

  <!-- State: Sẵn sàng / Đang bán (Available) -->
  <rect x="120" y="80" width="130" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="185" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Sẵn sàng (Available)</text>

  <!-- Bi-directional Transitions between Available & Hidden -->
  <!-- Available -> Hidden (Top arrow) -->
  <path d="M 250 95 L 390 95" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="320" y="87" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Ẩn sản phẩm</text>

  <!-- Hidden -> Available (Bottom arrow) -->
  <path d="M 390 125 L 250 125" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="320" y="140" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Mở bán lại</text>

  <!-- State: Đang ẩn (Hidden) -->
  <rect x="390" y="80" width="130" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="455" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Đang ẩn (Hidden)</text>

  <!-- Available -> Đã bán (Sold) -->
  <path d="M 185 140 L 185 230" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="193" y="190" font-family="Arial, sans-serif" font-size="11" text-anchor="start">Thanh toán đơn hàng (00)</text>

  <!-- State: Đã bán (Sold) -->
  <rect x="120" y="230" width="130" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.1" />
  <text x="185" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Đã bán (Sold)</text>

  <!-- Final State (double concentric circle) -->
  <circle cx="455" cy="260" r="10" stroke="black" stroke-width="1.1" fill="none" />
  <circle cx="455" cy="260" r="6" fill="black" />

  <!-- Paths connecting to the Final State -->
  <!-- From Đã bán (Sold) -> Final -->
  <path d="M 250 260 L 440 260" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="345" y="252" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Lưu lịch sử</text>

  <!-- From Đang ẩn (Hidden) -> Final -->
  <path d="M 455 140 L 455 245" stroke="black" stroke-width="1.1" fill="none" marker-end="url(#arrow)" />
  <text x="463" y="195" font-family="Arial, sans-serif" font-size="11" text-anchor="start">Xóa sản phẩm</text>
</svg>
