<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 860" width="100%" height="100%">
  <defs>
    <!-- Mũi tên kết nối chuẩn UML -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333333" />
    </marker>
    <!-- Hiệu ứng đổ bóng các khối thao tác -->
    <filter id="shadow" x="-5%" y="-5%" width="112%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Nền canvas trắng -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- TIÊU ĐỀ BIỂU ĐỒ -->
  <text x="400" y="22" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">
    AD-UC01 - Quản lý tài khoản (Activity Diagram)
  </text>

  <!-- ================= PHÂN LÀN (SWIMLANES) ================= -->
  <line x1="30" y1="35" x2="30" y2="835" stroke="#999999" stroke-width="1" />
  <line x1="390" y1="35" x2="390" y2="835" stroke="#999999" stroke-width="1" />
  <line x1="770" y1="35" x2="770" y2="835" stroke="#999999" stroke-width="1" />
  <line x1="30" y1="35" x2="770" y2="35" stroke="#999999" stroke-width="1" />
  <line x1="30" y1="65" x2="770" y2="65" stroke="#999999" stroke-width="1" />
  <line x1="30" y1="835" x2="770" y2="835" stroke="#999999" stroke-width="1" />

  <!-- Tiêu đề phân làn -->
  <text x="210" y="52" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Người dùng</text>
  <text x="580" y="52" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Hệ thống</text>

  <!-- ================= TIẾN TRÌNH THỰC HIỆN ================= -->

  <!-- 1. Điểm bắt đầu (Start Node) -->
  <circle cx="210" cy="88" r="8" fill="#000000" />

  <!-- Mũi tên từ Start xuống Mở trang -->
  <line x1="210" y1="96" x2="210" y2="115" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />

  <!-- Khối: Mở trang Quản lý tài khoản -->
  <rect x="125" y="115" width="170" height="40" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="1" filter="url(#shadow)" />
  <text x="210" y="132" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#000000">Truy cập trang</text>
  <text x="210" y="146" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#000000">Quản lý tài khoản</text>

  <!-- Mũi tên sang Hệ thống -->
  <line x1="295" y1="135" x2="475" y2="135" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />

  <!-- Hệ thống: Hiển thị thông tin tài khoản -->
  <rect x="475" y="115" width="200" height="40" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="1" filter="url(#shadow)" />
  <text x="575" y="132" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#000000">Kiểm tra phiên &amp; Hiển thị</text>
  <text x="575" y="146" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#000000">thông tin tài khoản</text>

  <!-- Mũi tên từ Hệ thống về Quyết định Thao tác -->
  <polyline points="575,155 575,175 210,175 210,195" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />

  <!-- Decision: Thao tác? -->
  <polygon points="210,195 260,210 210,225 160,210" fill="#fff9db" stroke="#cc0000" stroke-width="1" />
  <text x="210" y="214" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#990000">Thao tác?</text>

  <!-- ================= NHÁNH 1: CẬP NHẬT THÔNG TIN CÁ NHÂN ================= -->
  <!-- Mũi tên rẽ trái sang luồng Cập nhật -->
  <polyline points="160,210 115,210 115,245" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />
  <text x="110" y="203" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#000000">[Cập nhật]</text>

  <!-- Nhập thông tin -->
  <rect x="45" y="245" width="140" height="42" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="1" filter="url(#shadow)" />
  <text x="115" y="262" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#000000">Nhập họ tên,</text>
  <text x="115" y="276" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#000000">số điện thoại, email</text>

  <!-- Mũi tên xuống Lưu -->
  <line x1="115" y1="287" x2="115" y2="315" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />

  <!-- Nhấn Lưu thay đổi -->
  <rect x="45" y="315" width="140" height="38" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="1" filter="url(#shadow)" />
  <text x="115" y="338" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#000000">Nhấn &quot;Lưu thay đổi&quot;</text>

  <!-- Mũi tên sang Hệ thống validate -->
  <line x1="185" y1="334" x2="415" y2="334" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />

  <!-- Hệ thống kiểm tra hợp lệ -->
  <rect x="415" y="315" width="145" height="38" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="1" filter="url(#shadow)" />
  <text x="487" y="331" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#000000">Kiểm tra định dạng &amp;</text>
  <text x="487" y="344" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#000000">tính hợp lệ dữ liệu</text>

  <!-- Mũi tên xuống Decision Hợp lệ? -->
  <line x1="487" y1="353" x2="487" y2="375" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />

  <!-- Decision: Hợp lệ? -->
  <polygon points="487,375 522,390 487,405 452,390" fill="#fff9db" stroke="#cc0000" stroke-width="1" />
  <text x="487" y="394" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#990000">Hợp lệ?</text>

  <!-- Nhánh Không hợp lệ -->
  <polyline points="452,390 425,390 425,430" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />
  <text x="432" y="383" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#cc0000">Không</text>
  <rect x="395" y="430" width="70" height="35" rx="6" ry="6" fill="#ffffff" stroke="#333333" stroke-width="1" filter="url(#shadow)" />
  <text x="430" y="445" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#000000">Thông báo</text>
  <text x="430" y="457" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#000000">lỗi dữ liệu</text>

  <!-- Nhánh Hợp lệ -->
  <polyline points="522,390 545,390 545,430" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />
  <text x="538" y="383" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#006600">Có</text>
  <rect x="505" y="430" width="95" height="35" rx="6" ry="6" fill="#ffffff" stroke="#333333" stroke-width="1" filter="url(#shadow)" />
  <text x="552" y="445" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#000000">Cập nhật CSDL</text>
  <text x="552" y="457" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#000000">&amp; báo thành công</text>

  <!-- Merge Info -->
  <polyline points="430,465 430,485 477,485" fill="none" stroke="#333333" stroke-width="1" />
  <polyline points="552,465 552,485 497,485" fill="none" stroke="#333333" stroke-width="1" />
  <polygon points="487,477 497,485 487,493 477,485" fill="#f8cecc" stroke="#b85450" stroke-width="1" />

  <!-- ================= NHÁNH 2: ĐỔI MẬT KHẨU ================= -->
  <!-- Mũi tên rẽ phải sang luồng Đổi mật khẩu -->
  <polyline points="260,210 305,210 305,245" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />
  <text x="315" y="203" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#000000">[Đổi MK]</text>

  <!-- Nhập mật khẩu -->
  <rect x="225" y="245" width="155" height="42" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="1" filter="url(#shadow)" />
  <text x="302" y="262" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#000000">Nhập MK cũ, MK mới</text>
  <text x="302" y="276" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#000000">&amp; xác nhận MK</text>

  <!-- Mũi tên xuống Đổi MK -->
  <line x1="302" y1="287" x2="302" y2="315" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />

  <!-- Nhấn nút Đổi mật khẩu -->
  <rect x="235" y="315" width="135" height="38" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="1" filter="url(#shadow)" />
  <text x="302" y="338" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#000000">Nhấn &quot;Đổi mật khẩu&quot;</text>

  <!-- Mũi tên sang Hệ thống kiểm tra mật khẩu -->
  <line x1="370" y1="334" x2="615" y2="334" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />

  <!-- Hệ thống kiểm tra mật khẩu -->
  <rect x="615" y="315" width="145" height="38" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="1" filter="url(#shadow)" />
  <text x="687" y="331" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#000000">Kiểm tra mật khẩu cũ</text>
  <text x="687" y="344" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#000000">&amp; tính khớp nối</text>

  <!-- Mũi tên xuống Decision MK hợp lệ -->
  <line x1="687" y1="353" x2="687" y2="375" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />

  <!-- Decision: Đúng MK? -->
  <polygon points="687,375 722,390 687,405 652,390" fill="#fff9db" stroke="#cc0000" stroke-width="1" />
  <text x="687" y="394" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#990000">Đúng MK?</text>

  <!-- Nhánh Sai MK -->
  <polyline points="652,390 630,390 630,430" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />
  <text x="636" y="383" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#cc0000">Không</text>
  <rect x="600" y="430" width="70" height="35" rx="6" ry="6" fill="#ffffff" stroke="#333333" stroke-width="1" filter="url(#shadow)" />
  <text x="635" y="445" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#000000">Thông báo</text>
  <text x="635" y="457" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#000000">sai mật khẩu</text>

  <!-- Nhánh Đúng MK -->
  <polyline points="722,390 740,390 740,430" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />
  <text x="734" y="383" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#006600">Có</text>
  <rect x="695" y="430" width="70" height="35" rx="6" ry="6" fill="#ffffff" stroke="#333333" stroke-width="1" filter="url(#shadow)" />
  <text x="730" y="445" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Mã hóa Bcrypt,</text>
  <text x="730" y="457" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">lưu &amp; báo OK</text>

  <!-- Merge Pass -->
  <polyline points="635,465 635,485 677,485" fill="none" stroke="#333333" stroke-width="1" />
  <polyline points="730,465 730,485 697,485" fill="none" stroke="#333333" stroke-width="1" />
  <polygon points="687,477 697,485 687,493 677,485" fill="#f8cecc" stroke="#b85450" stroke-width="1" />

  <!-- ================= NHÁNH 3: ĐĂNG XUẤT ================= -->
  <!-- Mũi tên từ Quyết định xuống Đăng xuất -->
  <polyline points="210,225 210,545" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />
  <text x="210" y="525" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#000000">[Đăng xuất]</text>

  <!-- Nhấn Đăng xuất -->
  <rect x="135" y="545" width="150" height="40" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="1" filter="url(#shadow)" />
  <text x="210" y="569" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">Nhấn nút &quot;Đăng xuất&quot;</text>

  <!-- Mũi tên sang Hệ thống Hủy phiên -->
  <line x1="285" y1="565" x2="480" y2="565" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />

  <!-- Hệ thống: Hủy phiên -->
  <rect x="480" y="545" width="200" height="40" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="1" filter="url(#shadow)" />
  <text x="580" y="561" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#000000">Hủy phiên đăng nhập</text>
  <text x="580" y="575" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000000">(Revoke Token / Session)</text>

  <!-- Mũi tên xuống Điều hướng -->
  <line x1="580" y1="585" x2="580" y2="615" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />

  <!-- Hệ thống: Điều hướng -->
  <rect x="480" y="615" width="200" height="40" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="1" filter="url(#shadow)" />
  <text x="580" y="632" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000000">Điều hướng về</text>
  <text x="580" y="646" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000000">trang đăng nhập / trang chủ</text>

  <!-- ================= GỘP LUỒNG VÀ KẾT THÚC ================= -->
  <!-- Nối từ Merge Info xuống Merge Final -->
  <polyline points="487,493 487,705 565,705" fill="none" stroke="#333333" stroke-width="1" />

  <!-- Nối từ Merge Pass xuống Merge Final -->
  <polyline points="687,493 687,705 595,705" fill="none" stroke="#333333" stroke-width="1" />

  <!-- Nối từ Điều hướng xuống Merge Final -->
  <line x1="580" y1="655" x2="580" y2="695" stroke="#333333" stroke-width="1" />

  <!-- Merge Final -->
  <polygon points="580,695 595,705 580,715 565,705" fill="#f8cecc" stroke="#b85450" stroke-width="1" />

  <!-- Mũi tên từ Merge Final xuống End Node -->
  <line x1="580" y1="715" x2="580" y2="755" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" />

  <!-- End Node -->
  <circle cx="580" cy="765" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <circle cx="580" cy="765" r="7" fill="#000000" />
</svg>
