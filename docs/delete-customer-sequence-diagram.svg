<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 960" width="100%" height="100%">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#c00000"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
    <style>
      text { font-family: Arial, sans-serif; fill: #111; }
      .title { font-size: 19px; text-anchor: middle; font-weight: 700; }
      .head { font-size: 17px; text-anchor: middle; font-weight: 700; }
      .msg { font-size: 14px; fill: #c00000; text-anchor: middle; }
      .sql { font-size: 14px; fill: #111; text-anchor: middle; }
      .life { stroke: #c00000; stroke-width: 1; stroke-dasharray: 3 3; }
      .call { stroke: #c00000; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red); }
      .ret { stroke: #c00000; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; marker-end: url(#arrow-red); }
      .act { fill: #fff; stroke: #111; stroke-width: 1.2; filter: url(#shadow); }
      .bar { fill: #fff; stroke: #111; stroke-width: 1.8; filter: url(#shadow); }
      .frame { fill: none; stroke: #111; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#fff"/>
  <text x="450" y="26" class="title">Biểu đồ tuần tự Xóa khách hàng</text>

  <!-- Admin (actor) -->
  <g transform="translate(75,55)">
    <circle cx="0" cy="18" r="9" fill="#fff" stroke="#c00000" stroke-width="2"/>
    <line x1="0" y1="27" x2="0" y2="55" stroke="#c00000" stroke-width="2"/>
    <line x1="-15" y1="39" x2="15" y2="39" stroke="#c00000" stroke-width="2"/>
    <line x1="0" y1="55" x2="-14" y2="78" stroke="#c00000" stroke-width="2"/>
    <line x1="0" y1="55" x2="14" y2="78" stroke="#c00000" stroke-width="2"/>
    <text x="0" y="100" class="head">:Admin</text>
  </g>

  <!-- AdminDashboard (boundary) -->
  <g transform="translate(230,70)">
    <line x1="-24" y1="10" x2="-6" y2="10" stroke="#c00000" stroke-width="2"/>
    <line x1="-24" y1="-10" x2="-24" y2="30" stroke="#c00000" stroke-width="2"/>
    <circle cx="8" cy="10" r="15" fill="#fff" stroke="#c00000" stroke-width="2"/>
    <text x="0" y="60" class="head">:AdminDashboard</text>
  </g>

  <!-- AdminController (control) -->
  <g transform="translate(410,70)">
    <circle cx="0" cy="10" r="15" fill="#fff" stroke="#c00000" stroke-width="2"/>
    <path d="M-5 -6 A13 13 0 0 1 8 -3" fill="none" stroke="#c00000" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="0" y="60" class="head">:AdminController</text>
  </g>

  <!-- UserModel (entity) -->
  <g transform="translate(590,70)">
    <circle cx="0" cy="10" r="15" fill="#fff" stroke="#c00000" stroke-width="2"/>
    <line x1="-14" y1="25" x2="14" y2="25" stroke="#c00000" stroke-width="2"/>
    <text x="0" y="60" class="head">:UserModel</text>
  </g>

  <!-- users (database cylinder) -->
  <g transform="translate(760,55)">
    <path d="M-24 9 C-24 0,24 0,24 9 L24 46 C24 55,-24 55,-24 46 Z" fill="#fff9c4" stroke="#111" stroke-width="1.8" filter="url(#shadow)"/>
    <path d="M-24 9 C-24 18,24 18,24 9" fill="none" stroke="#111" stroke-width="1.8"/>
    <text x="0" y="82" class="head">:users</text>
  </g>

  <!-- Lifelines -->
  <line x1="75"  y1="155" x2="75"  y2="940" class="life"/>
  <line x1="230" y1="155" x2="230" y2="940" class="life"/>
  <line x1="410" y1="155" x2="410" y2="940" class="life"/>
  <line x1="590" y1="155" x2="590" y2="940" class="life"/>
  <line x1="760" y1="155" x2="760" y2="940" class="life"/>

  <!-- Frame header -->
  <line x1="25" y1="170" x2="875" y2="170" stroke="#777" stroke-width="2"/>
  <rect x="315" y="152" width="270" height="34" class="bar"/>
  <text x="450" y="174" font-size="17" font-weight="700" text-anchor="middle">Xóa khách hàng</text>

  <!-- Activation bars -->
  <rect x="223" y="220" width="14" height="660" class="act"/>
  <rect x="403" y="390" width="14" height="460" class="act"/>
  <rect x="583" y="700" width="14" height="115" class="act"/>
  <rect x="753" y="735" width="14" height="50"  class="act"/>

  <!-- 1. Admin → AdminDashboard -->
  <path d="M75 220 L223 220" class="call"/>
  <text x="149" y="205" class="msg">1. Chọn khách hàng</text>
  <text x="149" y="219" class="msg">cần xóa</text>

  <!-- 2. AdminDashboard → Admin (confirm dialog) -->
  <path d="M223 275 L75 275" class="ret"/>
  <text x="149" y="260" class="msg">2. Hiển thị hộp thoại</text>
  <text x="149" y="274" class="msg">xác nhận</text>

  <!-- 3. Admin → AdminDashboard (confirm) -->
  <path d="M75 335 L223 335" class="call"/>
  <text x="149" y="320" class="msg">3. Xác nhận</text>
  <text x="149" y="334" class="msg">xóa khách hàng</text>

  <!-- 4. AdminDashboard → AdminController -->
  <path d="M237 390 L403 390" class="call"/>
  <text x="320" y="375" class="msg">4. DELETE /admin/</text>
  <text x="320" y="389" class="msg">users/{id}</text>

  <!-- 5. AdminController self-call (check exists) -->
  <path d="M417 450 L470 450 Q485 450 485 465 L485 470 Q485 485 470 485 L417 485" class="call"/>
  <text x="470" y="435" class="msg">5. Kiểm tra khách</text>
  <text x="470" y="449" class="msg">hàng tồn tại</text>

  <!-- Alt fragment (not found branch only) -->
  <rect x="45" y="515" width="375" height="125" class="frame"/>
  <text x="85" y="535" font-size="11" font-weight="700">alt [Khách hàng không tồn tại]</text>

  <path d="M403 575 L237 575" class="ret"/>
  <text x="320" y="560" class="msg">"Không tìm thấy</text>
  <text x="320" y="574" class="msg">khách hàng"</text>

  <path d="M223 615 L75 615" class="ret"/>
  <text x="149" y="600" class="msg">Hiển thị</text>
  <text x="149" y="614" class="msg">thông báo lỗi</text>

  <!-- 6. AdminController → UserModel (delete) -->
  <path d="M417 700 L583 700" class="call"/>
  <text x="500" y="685" class="msg">6. Thực hiện</text>
  <text x="500" y="699" class="msg">xóa khách hàng</text>

  <!-- 7. UserModel → users (DELETE query) -->
  <path d="M597 735 L753 735" class="call"/>
  <text x="675" y="720" class="sql">DELETE FROM</text>
  <text x="675" y="734" class="sql">users WHERE id</text>

  <!-- 8. users → UserModel (success) -->
  <path d="M753 780 L597 780" class="ret"/>
  <text x="675" y="773" class="msg">Xóa thành công</text>

  <!-- 9. UserModel → AdminController (result) -->
  <path d="M583 810 L417 810" class="ret"/>
  <text x="500" y="795" class="msg">Kết quả xóa</text>
  <text x="500" y="809" class="msg">khách hàng</text>

  <!-- 10. AdminController → AdminDashboard (success) -->
  <path d="M403 845 L237 845" class="ret"/>
  <text x="320" y="830" class="msg">"Xóa khách hàng</text>
  <text x="320" y="844" class="msg">thành công"</text>

  <!-- 11. AdminDashboard → Admin (step 7 notification) -->
  <path d="M223 875 L75 875" class="ret"/>
  <text x="149" y="860" class="msg">7. Hiển thị</text>
  <text x="149" y="874" class="msg">thông báo</text>
</svg>
