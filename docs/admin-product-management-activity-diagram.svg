<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 780" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333333" />
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- TIÊU ĐỀ -->
  <text x="325" y="16" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">
    AD-UC07 - Quản lý sản phẩm số (Admin)
  </text>

  <!-- SWIMLANES -->
  <line x1="25" y1="22" x2="25" y2="760" stroke="#999999" stroke-width="1" />
  <line x1="280" y1="22" x2="280" y2="760" stroke="#999999" stroke-width="1" />
  <line x1="625" y1="22" x2="625" y2="760" stroke="#999999" stroke-width="1" />

  <text x="150" y="34" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Quản trị viên (Admin)</text>
  <text x="450" y="34" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Hệ thống</text>

  <!-- Start Node -->
  <circle cx="150" cy="52" r="7" fill="#000000" />
  <line x1="150" y1="59" x2="150" y2="76" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Mở Dashboard Admin -->
  <rect x="95" y="76" width="110" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="150" y="97" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Mở Dashboard Admin</text>

  <line x1="205" y1="93" x2="380" y2="93" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Kiểm tra quyền Admin -->
  <rect x="380" y="76" width="140" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="450" y="97" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Kiểm tra quyền Admin</text>

  <line x1="450" y1="110" x2="450" y2="135" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Decision: Admin hợp lệ? -->
  <polygon points="450,135 505,150 450,165 395,150" fill="#fff9db" stroke="#cc0000" stroke-width="0.9" />
  <text x="450" y="153" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#990000">Quyền Admin?</text>

  <!-- Không hợp lệ -->
  <text x="515" y="145" font-family="Arial, sans-serif" font-size="8" fill="#cc0000">[Không]</text>
  <path d="M 505 150 L 535 150 L 535 195" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="480" y="195" width="110" height="32" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="535" y="215" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Từ chối truy cập</text>
  <line x1="535" y1="227" x2="535" y2="252" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <circle cx="535" cy="262" r="9" fill="none" stroke="#000000" stroke-width="1.5" />
  <circle cx="535" cy="262" r="5" fill="#000000" />

  <!-- Hợp lệ -->
  <text x="350" y="160" font-family="Arial, sans-serif" font-size="8" fill="#008800">[Hợp lệ]</text>
  <path d="M 450 165 L 450 215 L 205 215" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Mở tab sản phẩm & chọn thao tác -->
  <rect x="95" y="198" width="110" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="150" y="218" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Vào Quản lý sản phẩm</text>

  <line x1="150" y1="232" x2="150" y2="260" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Decision: Thao tác -->
  <polygon points="150,260 205,275 150,290 95,275" fill="#fff9db" stroke="#cc0000" stroke-width="0.9" />
  <text x="150" y="278" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#990000">Thao tác?</text>

  <!-- Nhánh 1: Thêm mới -->
  <text x="45" y="295" font-family="Arial, sans-serif" font-size="8" fill="#555555">Thêm mới</text>
  <path d="M 95 275 L 79 275 L 79 310" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="35" y="310" width="88" height="30" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="79" y="328" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Điền Form &amp; Acc/Mã</text>

  <!-- Nhánh 2: Sửa -->
  <text x="160" y="302" font-family="Arial, sans-serif" font-size="8" fill="#555555">Sửa</text>
  <line x1="150" y1="290" x2="150" y2="365" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="105" y="365" width="90" height="30" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="150" y="383" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Sửa giá, mô tả, ảnh</text>

  <!-- Nhánh 3: Xóa -->
  <text x="220" y="295" font-family="Arial, sans-serif" font-size="8" fill="#555555">Xóa</text>
  <path d="M 205 275 L 237.5 275 L 237.5 310" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="195" y="310" width="85" height="30" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="237.5" y="328" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Xác nhận xóa</text>

  <!-- Luồng Xóa sang Hệ thống -->
  <path d="M 237.5 340 L 237.5 415 L 380 415" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="380" y="398" width="140" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="450" y="418" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Xóa sản phẩm trong CSDL</text>

  <!-- Nút gộp (Merge Node) gom 2 luồng Thêm mới & Sửa trước khi Validate -->
  <polygon points="150,457 165,467 150,477 135,467" fill="#f8cecc" stroke="#b85450" stroke-width="0.8" />
  <!-- Nhánh Thêm mới đi vào góc trái hình thoi -->
  <path d="M 79 340 L 79 467 L 135 467" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <!-- Nhánh Sửa đi thẳng xuống góc trên hình thoi -->
  <line x1="150" y1="395" x2="150" y2="457" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <!-- Đầu ra từ góc phải hình thoi sang Validate dữ liệu đầu vào -->
  <line x1="165" y1="467" x2="380" y2="467" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <rect x="380" y="450" width="140" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="450" y="470" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Validate dữ liệu đầu vào</text>

  <line x1="450" y1="484" x2="450" y2="510" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Decision: Hợp lệ? -->
  <polygon points="450,510 505,525 450,540 395,525" fill="#fff9db" stroke="#cc0000" stroke-width="0.9" />
  <text x="450" y="528" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#990000">Hợp lệ?</text>

  <!-- Nhánh Lỗi qua bên trái (rộng rãi và không bị đè đường) -->
  <text x="365" y="518" font-family="Arial, sans-serif" font-size="8" fill="#cc0000">[Lỗi]</text>
  <path d="M 395 525 L 340 525 L 340 550" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="292" y="550" width="96" height="30" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="340" y="568" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Báo lỗi trên form</text>
  <line x1="340" y1="580" x2="340" y2="605" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <circle cx="340" cy="615" r="9" fill="none" stroke="#000000" stroke-width="1.5" />
  <circle cx="340" cy="615" r="5" fill="#000000" />

  <!-- Nhánh Hợp lệ đi thẳng xuống -->
  <text x="455" y="555" font-family="Arial, sans-serif" font-size="8" fill="#008800">[Hợp lệ]</text>
  <line x1="450" y1="540" x2="450" y2="605" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="375" y="605" width="150" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="450" y="625" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Lưu sản phẩm &amp; mã số vào DB</text>

  <!-- Gộp kết thúc -->
  <polygon points="450,670 465,679 450,688 435,679" fill="#f8cecc" stroke="#b85450" stroke-width="0.8" />
  <!-- Đường từ Xóa chạy men theo lề phải (x=575) xuống góc phải nút gộp, hoàn toàn không đè lên nhánh [Lỗi] -->
  <path d="M 520 415 L 575 415 L 575 679 L 465 679" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <!-- Đường từ Lưu thành công đi thẳng vào đỉnh trên nút gộp -->
  <path d="M 450 639 L 450 670" fill="none" stroke="#333333" stroke-width="0.9" />

  <line x1="450" y1="688" x2="450" y2="720" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- End Node -->
  <circle cx="450" cy="730" r="10" fill="none" stroke="#000000" stroke-width="1.5" />
  <circle cx="450" cy="730" r="6" fill="#000000" />
</svg>
