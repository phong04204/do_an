<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" width="100%" height="100%">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#c00000"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-opacity="0.28"/>
    </filter>
    <style>
      text { font-family: Arial, sans-serif; fill: #111; }
      .title { font-size: 19px; text-anchor: middle; }
      .head { font-size: 19px; text-anchor: middle; }
      .msgText { font-size: 14px; fill: #c00000; text-anchor: middle; }
      .sqlText { font-size: 14px; fill: #111; text-anchor: middle; }
      .life { stroke: #c00000; stroke-width: 1; }
      .call { stroke: #c00000; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red); }
      .ret { stroke: #c00000; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; marker-end: url(#arrow-red); }
      .act { fill: #fff; stroke: #111; stroke-width: 1.2; filter: url(#shadow); }
      .bar { fill: #fff; stroke: #111; stroke-width: 1.8; filter: url(#shadow); }
      .frame { fill: none; stroke: #111; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#fff"/>
  <text x="450" y="25" class="title">UC - Quản lý sản phẩm</text>

  <!-- Actor :Admin -->
  <g transform="translate(75,55)">
    <circle cx="0" cy="18" r="9" fill="#fff" stroke="#c00000" stroke-width="2"/>
    <line x1="0" y1="27" x2="0" y2="55" stroke="#c00000" stroke-width="2"/>
    <line x1="-15" y1="39" x2="15" y2="39" stroke="#c00000" stroke-width="2"/>
    <line x1="0" y1="55" x2="-14" y2="78" stroke="#c00000" stroke-width="2"/>
    <line x1="0" y1="55" x2="14" y2="78" stroke="#c00000" stroke-width="2"/>
    <text x="0" y="100" class="head">:Admin</text>
  </g>

  <!-- Boundary :UI -->
  <g transform="translate(225,70)">
    <line x1="-24" y1="10" x2="-6" y2="10" stroke="#c00000" stroke-width="2"/>
    <line x1="-24" y1="-10" x2="-24" y2="30" stroke="#c00000" stroke-width="2"/>
    <circle cx="8" cy="10" r="15" fill="#fff" stroke="#c00000" stroke-width="2"/>
    <text x="0" y="60" class="head">:UI</text>
  </g>

  <!-- Control :AdminController -->
  <g transform="translate(395,70)">
    <circle cx="0" cy="10" r="15" fill="#fff" stroke="#c00000" stroke-width="2"/>
    <path d="M-5 -6 A13 13 0 0 1 8 -3" fill="none" stroke="#c00000" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="0" y="60" class="head">:AdminController</text>
  </g>

  <!-- Entity :ProductModel -->
  <g transform="translate(565,70)">
    <circle cx="0" cy="10" r="15" fill="#fff" stroke="#c00000" stroke-width="2"/>
    <line x1="-14" y1="25" x2="14" y2="25" stroke="#c00000" stroke-width="2"/>
    <text x="0" y="60" class="head">:ProductModel</text>
  </g>

  <!-- Database :products -->
  <g transform="translate(735,55)">
    <path d="M-24 9 C-24 0,24 0,24 9 L24 46 C24 55,-24 55,-24 46 Z" fill="#fff9c4" stroke="#111" stroke-width="1.8" filter="url(#shadow)"/>
    <path d="M-24 9 C-24 18,24 18,24 9" fill="none" stroke="#111" stroke-width="1.8"/>
    <text x="0" y="82" class="head">:products</text>
  </g>

  <!-- Lifelines solid, matching previous correction -->
  <line x1="75" y1="155" x2="75" y2="1080" class="life"/>
  <line x1="225" y1="155" x2="225" y2="1080" class="life"/>
  <line x1="395" y1="155" x2="395" y2="1080" class="life"/>
  <line x1="565" y1="155" x2="565" y2="1080" class="life"/>
  <line x1="735" y1="155" x2="735" y2="1080" class="life"/>

  <!-- Section bar -->
  <line x1="25" y1="168" x2="875" y2="168" stroke="#777" stroke-width="2"/>
  <line x1="25" y1="173" x2="875" y2="173" stroke="#bbb" stroke-width="2"/>
  <rect x="295" y="150" width="310" height="34" class="bar"/>
  <text x="450" y="172" font-size="17" font-weight="700" text-anchor="middle">Quản lý sản phẩm</text>

  <!-- Activation boxes -->
  <rect x="218" y="230" width="14" height="805" class="act"/>
  <rect x="388" y="285" width="14" height="705" class="act"/>
  <rect x="558" y="345" width="14" height="150" class="act"/>
  <rect x="728" y="380" width="14" height="70" class="act"/>
  <rect x="558" y="680" width="14" height="250" class="act"/>
  <rect x="728" y="720" width="14" height="170" class="act"/>

  <!-- Load product list -->
  <path d="M75 230 L218 230" class="call"/>
  <text x="145" y="215" class="msgText">1. Mở trang</text>
  <text x="145" y="229" class="msgText">quản lý sản phẩm</text>

  <path d="M232 285 L388 285" class="call"/>
  <text x="310" y="270" class="msgText">2. Gửi yêu cầu</text>
  <text x="310" y="284" class="msgText">lấy danh sách</text>

  <path d="M402 345 L558 345" class="call"/>
  <text x="480" y="330" class="msgText">3. Kiểm tra quyền</text>
  <text x="480" y="344" class="msgText">và truy vấn</text>

  <path d="M572 380 L728 380" class="call"/>
  <text x="650" y="365" class="sqlText">SELECT *</text>
  <text x="650" y="379" class="sqlText">FROM products</text>

  <path d="M728 450 L572 450" class="ret"/>
  <text x="650" y="443" class="msgText">Danh sách sản phẩm</text>

  <path d="M558 495 L402 495" class="ret"/>
  <text x="480" y="488" class="msgText">Trả về danh sách</text>

  <path d="M388 540 L232 540" class="ret"/>
  <text x="310" y="525" class="msgText">Hiển thị bảng</text>
  <text x="310" y="539" class="msgText">sản phẩm</text>

  <!-- CRUD section -->
  <path d="M75 590 L218 590" class="call"/>
  <text x="145" y="575" class="msgText">4. Chọn thêm / sửa / xóa</text>
  <text x="145" y="589" class="msgText">sản phẩm</text>

  <path d="M75 635 L218 635" class="call"/>
  <text x="145" y="620" class="msgText">5. Nhập hoặc xác nhận</text>
  <text x="145" y="634" class="msgText">thông tin</text>

  <path d="M232 680 L388 680" class="call"/>
  <text x="310" y="672" class="msgText">6. Gửi yêu cầu</text>

  <path d="M402 720 L558 720" class="call"/>
  <text x="480" y="705" class="msgText">7. Kiểm tra quyền</text>
  <text x="480" y="719" class="msgText">và validate dữ liệu</text>

  <rect x="45" y="745" width="365" height="110" class="frame"/>
  <text x="85" y="763" font-size="11" font-weight="700">alt [Dữ liệu không hợp lệ]</text>
  <path d="M388 795 L232 795" class="ret"/>
  <text x="310" y="780" class="msgText">
    <tspan x="310" dy="0">"Thông tin sản phẩm</tspan>
    <tspan x="310" dy="13">không hợp lệ"</tspan>
  </text>
  <path d="M218 835 L75 835" class="ret"/>
  <text x="145" y="820" class="msgText">Hiển thị lỗi,</text>
  <text x="145" y="834" class="msgText">nhập lại</text>

  <path d="M572 855 L728 855" class="call"/>
  <text x="650" y="826" class="sqlText">INSERT / UPDATE / DELETE</text>
  <text x="650" y="840" class="sqlText">game_accounts, game_cards</text>
  <text x="650" y="854" class="sqlText">hoặc game_giftcodes</text>

  <path d="M728 890 L572 890" class="ret"/>
  <text x="650" y="883" class="msgText">Kết quả thao tác</text>

  <path d="M558 930 L402 930" class="ret"/>
  <text x="480" y="923" class="msgText">Trả về dữ liệu phản hồi</text>

  <path d="M388 980 L232 980" class="ret"/>
  <text x="310" y="965" class="msgText">Cập nhật danh sách</text>
  <text x="310" y="979" class="msgText">sản phẩm</text>

  <path d="M218 1030 L75 1030" class="ret"/>
  <text x="145" y="1002" class="msgText">8. Hiển thị thông báo</text>
  <text x="145" y="1016" class="msgText">thành công</text>
</svg>

