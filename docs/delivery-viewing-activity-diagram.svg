<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 750" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333333" />
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- TIÊU ĐỀ -->
  <text x="325" y="16" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">
    AD-UC06 - Tự động bàn giao &amp; Xem thông tin sản phẩm sau mua
  </text>

  <!-- SWIMLANES -->
  <line x1="25" y1="22" x2="25" y2="730" stroke="#999999" stroke-width="1" />
  <line x1="270" y1="22" x2="270" y2="730" stroke="#999999" stroke-width="1" />
  <line x1="625" y1="22" x2="625" y2="730" stroke="#999999" stroke-width="1" />

  <text x="145" y="34" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Người mua</text>
  <text x="450" y="34" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Hệ thống</text>

  <!-- Start Node -->
  <circle cx="145" cy="52" r="7" fill="#000000" />
  <line x1="145" y1="59" x2="145" y2="76" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Vào Lịch sử đơn hàng -->
  <rect x="90" y="76" width="110" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="145" y="97" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Vào Lịch sử đơn hàng</text>

  <line x1="200" y1="93" x2="385" y2="93" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Hệ thống kiểm tra auth -->
  <rect x="385" y="76" width="130" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="450" y="97" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Kiểm tra đăng nhập</text>

  <line x1="450" y1="110" x2="450" y2="135" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Decision: Đã đăng nhập? -->
  <polygon points="450,135 505,150 450,165 395,150" fill="#fff9db" stroke="#cc0000" stroke-width="0.9" />
  <text x="450" y="153" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#990000">Đã đăng nhập?</text>

  <!-- Chưa đăng nhập -->
  <text x="510" y="146" font-family="Arial, sans-serif" font-size="8" fill="#cc0000">[Chưa]</text>
  <path d="M 505 150 L 555 150 L 555 195 L 495 195" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="395" y="180" width="100" height="30" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="445" y="198" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Chuyển sang Login</text>

  <!-- Đã đăng nhập -->
  <text x="350" y="160" font-family="Arial, sans-serif" font-size="8" fill="#008800">[Đã có]</text>
  <line x1="450" y1="165" x2="450" y2="235" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="380" y="235" width="140" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="450" y="255" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Tải danh sách đơn hàng</text>

  <path d="M 380 252 L 200 252" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khách chọn xem đơn -->
  <rect x="90" y="235" width="110" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="145" y="255" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Chọn xem chi tiết đơn</text>

  <line x1="145" y1="269" x2="145" y2="305" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Kiểm tra quyền sở hữu đơn -->
  <path d="M 200 322 L 375 322" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="85" y="305" width="115" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="142" y="325" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Gửi yêu cầu GET /orders/{id}</text>

  <rect x="375" y="305" width="150" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="450" y="325" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#000000">Kiểm tra quyền sở hữu đơn</text>

  <line x1="450" y1="339" x2="450" y2="368" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Decision: Chính chủ? -->
  <polygon points="450,368 505,383 450,398 395,383" fill="#fff9db" stroke="#cc0000" stroke-width="0.9" />
  <text x="450" y="386" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#990000">Đúng chính chủ?</text>

  <!-- Không chính chủ -->
  <text x="510" y="379" font-family="Arial, sans-serif" font-size="8" fill="#cc0000">[Không]</text>
  <path d="M 505 383 L 555 383 L 555 425 L 495 425" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="400" y="410" width="95" height="30" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="447" y="428" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Báo 403 Forbidden</text>

  <!-- Chính chủ -> Trích xuất dữ liệu bàn giao -->
  <text x="360" y="395" font-family="Arial, sans-serif" font-size="8" fill="#008800">[Đúng]</text>
  <line x1="450" y1="398" x2="450" y2="465" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="375" y="465" width="150" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="450" y="480" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">
    <tspan x="450" dy="0">Trích xuất delivered_data</tspan>
    <tspan x="450" dy="10">&amp; che mật khẩu ••••••••</tspan>
  </text>

  <path d="M 375 482 L 200 482" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Khách xem và tương tác -->
  <rect x="85" y="465" width="115" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="142" y="480" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">
    <tspan x="142" dy="0">Hiển thị khung bàn giao:</tspan>
    <tspan x="142" dy="10">User, Pass / Serial, Mã thẻ</tspan>
  </text>

  <line x1="142" y1="499" x2="142" y2="530" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- Quyết định thao tác -->
  <polygon points="142,530 197,545 142,560 87,545" fill="#fff9db" stroke="#cc0000" stroke-width="0.9" />
  <text x="142" y="548" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#990000">Thao tác?</text>

  <!-- Nhánh 1: Ẩn/Hiện -->
  <text x="50" y="565" font-family="Arial, sans-serif" font-size="8" fill="#555555">Bấm 'Con mắt'</text>
  <path d="M 87 545 L 60 545 L 60 585 L 90 585" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="90" y="570" width="105" height="30" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="142" y="588" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Ẩn / Hiện mật khẩu</text>

  <!-- Nhánh 2: Sao chép -->
  <text x="195" y="565" font-family="Arial, sans-serif" font-size="8" fill="#555555">Bấm 'Sao chép'</text>
  <path d="M 197 545 L 225 545 L 225 585 L 195 585" fill="none" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />
  <rect x="200" y="570" width="60" height="30" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.9" filter="url(#shadow)" />
  <text x="230" y="588" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#000000">Copy mã</text>

  <!-- Gộp kết thúc -->
  <polygon points="142,630 157,639 142,648 127,639" fill="#f8cecc" stroke="#b85450" stroke-width="0.8" />
  <path d="M 142 600 L 142 630" fill="none" stroke="#333333" stroke-width="0.9" />
  <path d="M 230 600 L 230 639 L 157 639" fill="none" stroke="#333333" stroke-width="0.9" />

  <line x1="142" y1="648" x2="142" y2="685" stroke="#333333" stroke-width="0.9" marker-end="url(#arrow)" />

  <!-- End Node -->
  <circle cx="142" cy="695" r="10" fill="none" stroke="#000000" stroke-width="1.5" />
  <circle cx="142" cy="695" r="6" fill="#000000" />
</svg>
