<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="100%" height="100%">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#c00000"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
    <style>
      text { font-family: Arial, sans-serif; fill: #111; }
      .title { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .head { font-size: 14px; font-weight: 700; text-anchor: middle; }
      .msg { font-size: 13px; fill: #c00000; text-anchor: middle; }
      .life { stroke: #c00000; stroke-width: 1; stroke-dasharray: 3 3; }
      .call { stroke: #c00000; stroke-width: 1.4; fill: none; marker-end: url(#arrow-red); }
      .ret { stroke: #c00000; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; marker-end: url(#arrow-red); }
      .act { fill: #fff; stroke: #111; stroke-width: 1.1; filter: url(#shadow); }
      .bar { fill: #fff; stroke: #111; stroke-width: 1.5; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#fff"/>
  <text x="450" y="28" class="title">Biểu đồ tuần tự Mua hàng / Thanh toán</text>

  <g transform="translate(70,55)">
    <circle cx="0" cy="16" r="8" fill="#fff" stroke="#c00000" stroke-width="1.6"/>
    <line x1="0" y1="24" x2="0" y2="50" stroke="#c00000" stroke-width="1.6"/>
    <line x1="-13" y1="36" x2="13" y2="36" stroke="#c00000" stroke-width="1.6"/>
    <line x1="0" y1="50" x2="-11" y2="68" stroke="#c00000" stroke-width="1.6"/>
    <line x1="0" y1="50" x2="11" y2="68" stroke="#c00000" stroke-width="1.6"/>
    <text x="0" y="90" class="head">:Khách hàng</text>
  </g>

  <g transform="translate(210,75)">
    <line x1="-24" y1="10" x2="-6" y2="10" stroke="#c00000" stroke-width="1.6"/>
    <line x1="-24" y1="-8" x2="-24" y2="28" stroke="#c00000" stroke-width="1.6"/>
    <circle cx="8" cy="10" r="15" fill="#fff9c4" stroke="#c00000" stroke-width="1.6"/>
    <text x="0" y="52" class="head">:CheckoutPage</text>
  </g>

  <g transform="translate(360,75)">
    <circle cx="0" cy="10" r="15" fill="#fff9c4" stroke="#c00000" stroke-width="1.6"/>
    <path d="M-5 -4 A13 13 0 0 1 8 -2" fill="none" stroke="#c00000" stroke-width="1.6" marker-end="url(#arrow-red)"/>
    <text x="0" y="52" class="head">:OrderController</text>
  </g>

  <g transform="translate(510,75)">
    <circle cx="0" cy="10" r="15" fill="#fff9c4" stroke="#c00000" stroke-width="1.6"/>
    <line x1="-14" y1="25" x2="14" y2="25" stroke="#c00000" stroke-width="1.6"/>
    <text x="0" y="52" class="head">:ProductModel</text>
  </g>

  <g transform="translate(650,75)">
    <circle cx="0" cy="10" r="15" fill="#fff9c4" stroke="#c00000" stroke-width="1.6"/>
    <text x="0" y="52" class="head">:VNPay</text>
  </g>

  <g transform="translate(800,75)">
    <circle cx="0" cy="10" r="15" fill="#fff9c4" stroke="#c00000" stroke-width="1.6"/>
    <line x1="-14" y1="25" x2="14" y2="25" stroke="#c00000" stroke-width="1.6"/>
    <text x="0" y="52" class="head">:OrderModel</text>
  </g>

  <line x1="70" y1="160" x2="70" y2="730" class="life"/>
  <line x1="210" y1="160" x2="210" y2="730" class="life"/>
  <line x1="360" y1="160" x2="360" y2="730" class="life"/>
  <line x1="510" y1="160" x2="510" y2="730" class="life"/>
  <line x1="650" y1="160" x2="650" y2="730" class="life"/>
  <line x1="800" y1="160" x2="800" y2="730" class="life"/>

  <line x1="25" y1="170" x2="875" y2="170" stroke="#777" stroke-width="1.5"/>
  <rect x="310" y="152" width="280" height="34" class="bar"/>
  <text x="450" y="174" font-size="16" font-weight="700" text-anchor="middle">Mua hàng / Thanh toán</text>

  <rect x="204" y="220" width="12" height="500" class="act"/>
  <rect x="354" y="280" width="12" height="410" class="act"/>
  <rect x="504" y="340" width="12" height="70" class="act"/>
  <rect x="644" y="500" width="12" height="85" class="act"/>
  <rect x="794" y="625" width="12" height="40" class="act"/>

  <path d="M70 220 L204 220" class="call"/>
  <text x="137" y="204" class="msg">1. Chọn sản phẩm</text>
  <text x="137" y="218" class="msg">trong giỏ</text>

  <path d="M216 290 L354 290" class="call"/>
  <text x="285" y="274" class="msg">2. Tạo đơn hàng</text>

  <path d="M366 350 L504 350" class="call"/>
  <text x="435" y="334" class="msg">3. Kiểm tra sản phẩm</text>
  <text x="435" y="348" class="msg">còn khả dụng</text>

  <path d="M504 405 L366 405" class="ret"/>
  <text x="435" y="398" class="msg">Sản phẩm hợp lệ</text>

  <path d="M354 455 L216 455" class="ret"/>
  <text x="285" y="439" class="msg">4. URL thanh toán</text>
  <text x="285" y="453" class="msg">VNPay</text>

  <path d="M216 500 L644 500" class="call"/>
  <text x="430" y="484" class="msg">Chuyển hướng đến</text>
  <text x="430" y="498" class="msg">URL thanh toán</text>

  <path d="M644 525 L70 525" class="ret"/>
  <text x="357" y="519" class="msg">Hiển thị trang thanh toán</text>

  <path d="M70 555 L644 555" class="call"/>
  <text x="357" y="549" class="msg">Khách hàng thanh toán</text>

  <path d="M644 585 L366 585" class="ret"/>
  <text x="505" y="569" class="msg">5. Callback kết quả</text>
  <text x="505" y="583" class="msg">thanh toán</text>

  <path d="M366 625 L794 625" class="call"/>
  <text x="580" y="609" class="msg">6. Cập nhật đơn hàng</text>

  <path d="M794 665 L366 665" class="ret"/>
  <text x="580" y="658" class="msg">Cập nhật thành công</text>

  <path d="M354 690 L216 690" class="ret"/>
  <text x="285" y="674" class="msg">7. Bàn giao thông tin</text>
  <text x="285" y="688" class="msg">sản phẩm</text>

  <path d="M204 720 L70 720" class="ret"/>
  <text x="137" y="704" class="msg">Hiển thị thông tin</text>
  <text x="137" y="718" class="msg">bàn giao</text>
</svg>
