<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 900" width="100%" height="100%">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#c00000"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
    <style>
      text { font-family: Arial, sans-serif; fill: #111; }
      .title { font-size: 19px; text-anchor: middle; font-weight: 700; }
      .head { font-size: 17px; text-anchor: middle; font-weight: 700; }
      .msg { font-size: 14px; fill: #c00000; text-anchor: middle; }
      .sql { font-size: 14px; fill: #111; text-anchor: middle; }
      .life { stroke: #c00000; stroke-width: 1; stroke-dasharray: 3 3; }
      .call { stroke: #c00000; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red); }
      .ret { stroke: #c00000; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; marker-end: url(#arrow-red); }
      .act { fill: #fff; stroke: #111; stroke-width: 1.2; filter: url(#shadow); }
      .bar { fill: #fff; stroke: #111; stroke-width: 1.8; filter: url(#shadow); }
      .frame { fill: none; stroke: #111; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#fff"/>
  <text x="430" y="26" class="title">Biểu đồ tuần tự Thêm khách hàng</text>

  <g transform="translate(75,55)">
    <circle cx="0" cy="18" r="9" fill="#fff" stroke="#c00000" stroke-width="2"/>
    <line x1="0" y1="27" x2="0" y2="55" stroke="#c00000" stroke-width="2"/>
    <line x1="-15" y1="39" x2="15" y2="39" stroke="#c00000" stroke-width="2"/>
    <line x1="0" y1="55" x2="-14" y2="78" stroke="#c00000" stroke-width="2"/>
    <line x1="0" y1="55" x2="14" y2="78" stroke="#c00000" stroke-width="2"/>
    <text x="0" y="100" class="head">:Admin</text>
  </g>

  <g transform="translate(220,70)">
    <line x1="-24" y1="10" x2="-6" y2="10" stroke="#c00000" stroke-width="2"/>
    <line x1="-24" y1="-10" x2="-24" y2="30" stroke="#c00000" stroke-width="2"/>
    <circle cx="8" cy="10" r="15" fill="#fff" stroke="#c00000" stroke-width="2"/>
    <text x="0" y="60" class="head">:AdminDashboard</text>
  </g>

  <g transform="translate(390,70)">
    <circle cx="0" cy="10" r="15" fill="#fff" stroke="#c00000" stroke-width="2"/>
    <path d="M-5 -6 A13 13 0 0 1 8 -3" fill="none" stroke="#c00000" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="0" y="60" class="head">:AdminController</text>
  </g>

  <g transform="translate(560,70)">
    <circle cx="0" cy="10" r="15" fill="#fff" stroke="#c00000" stroke-width="2"/>
    <line x1="-14" y1="25" x2="14" y2="25" stroke="#c00000" stroke-width="2"/>
    <text x="0" y="60" class="head">:UserModel</text>
  </g>

  <g transform="translate(725,55)">
    <path d="M-24 9 C-24 0,24 0,24 9 L24 46 C24 55,-24 55,-24 46 Z" fill="#fff9c4" stroke="#111" stroke-width="1.8" filter="url(#shadow)"/>
    <path d="M-24 9 C-24 18,24 18,24 9" fill="none" stroke="#111" stroke-width="1.8"/>
    <text x="0" y="82" class="head">:users</text>
  </g>

  <line x1="75" y1="155" x2="75" y2="860" class="life"/>
  <line x1="220" y1="155" x2="220" y2="860" class="life"/>
  <line x1="390" y1="155" x2="390" y2="860" class="life"/>
  <line x1="560" y1="155" x2="560" y2="860" class="life"/>
  <line x1="725" y1="155" x2="725" y2="860" class="life"/>

  <line x1="25" y1="170" x2="835" y2="170" stroke="#777" stroke-width="2"/>
  <rect x="305" y="152" width="250" height="34" class="bar"/>
  <text x="430" y="174" font-size="17" font-weight="700" text-anchor="middle">Thêm khách hàng</text>

  <rect x="213" y="220" width="14" height="630" class="act"/>
  <rect x="383" y="380" width="14" height="445" class="act"/>
  <rect x="553" y="705" width="14" height="95" class="act"/>
  <rect x="718" y="735" width="14" height="40" class="act"/>

  <path d="M75 220 L213 220" class="call"/>
  <text x="143" y="205" class="msg">1. Chọn chức năng</text>
  <text x="143" y="219" class="msg">thêm khách hàng</text>

  <path d="M213 270 L75 270" class="ret"/>
  <text x="143" y="255" class="msg">2. Hiển thị form</text>
  <text x="143" y="269" class="msg">thêm khách hàng</text>

  <path d="M75 325 L213 325" class="call"/>
  <text x="143" y="310" class="msg">3. Nhập thông tin</text>
  <text x="143" y="324" class="msg">khách hàng</text>

  <path d="M75 380 L213 380" class="call"/>
  <text x="143" y="365" class="msg">4. Nhấn nút</text>
  <text x="143" y="379" class="msg">"Lưu"</text>

  <path d="M227 430 L383 430" class="call"/>
  <text x="305" y="415" class="msg">5. Gửi yêu cầu</text>
  <text x="305" y="429" class="msg">tạo khách hàng</text>

  <path d="M397 500 L455 500 Q470 500 470 515 L470 520 Q470 535 455 535 L397 535" class="call"/>
  <text x="455" y="474" class="msg">6. Kiểm tra</text>
  <text x="455" y="488" class="msg">dữ liệu hợp lệ</text>

  <rect x="45" y="575" width="360" height="105" class="frame"/>
  <text x="85" y="595" font-size="11" font-weight="700">alt [Dữ liệu không hợp lệ]</text>
  <path d="M383 630 L227 630" class="ret"/>
  <text x="305" y="614" class="msg">Thông tin khách hàng</text>
  <text x="305" y="628" class="msg">không hợp lệ</text>
  <path d="M213 660 L75 660" class="ret"/>
  <text x="143" y="645" class="msg">Hiển thị lỗi,</text>
  <text x="143" y="659" class="msg">yêu cầu nhập lại</text>

  <path d="M397 705 L553 705" class="call"/>
  <text x="475" y="689" class="msg">7. Tạo khách hàng mới</text>

  <path d="M567 735 L714 735" class="call"/>
  <text x="642" y="713" class="sql">INSERT INTO</text>
  <text x="642" y="727" class="sql">users</text>

  <path d="M714 775 L567 775" class="ret"/>
  <text x="642" y="762" class="msg">Lưu thành công</text>

  <path d="M553 800 L397 800" class="ret"/>
  <text x="475" y="779" class="msg">Đối tượng khách hàng</text>
  <text x="475" y="793" class="msg">đã tạo</text>

  <path d="M383 825 L227 825" class="ret"/>
  <text x="305" y="803" class="msg">Thêm khách hàng</text>
  <text x="305" y="817" class="msg">thành công</text>

  <path d="M213 850 L75 850" class="ret"/>
  <text x="143" y="829" class="msg">8. Hiển thị</text>
  <text x="143" y="843" class="msg">thông báo</text>
</svg>
